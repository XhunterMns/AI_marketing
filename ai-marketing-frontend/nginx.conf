server {

    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;


    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Root-level backend routes (used by some older frontend bundles)
    location = /generate {
        proxy_pass http://backend:3000/generate;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /generate-campaign {
        proxy_pass http://backend:3000/generate-campaign;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /competitor-analysis {
        proxy_pass http://backend:3000/competitor-analysis;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /meta/post {
        proxy_pass http://backend:3000/meta/post;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /telegram/send {
        proxy_pass http://backend:3000/telegram/send;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~ ^/campaigns/[^/]+/(approve|decline|cancel)$ {
        proxy_pass http://backend:3000$uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}