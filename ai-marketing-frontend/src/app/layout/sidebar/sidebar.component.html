<aside
  class="sidebar flex h-full flex-col border-r border-white/[0.06] bg-surface-1/95 backdrop-blur-xl transition-all duration-300"
  [ngClass]="collapsed ? 'w-[72px]' : 'w-64'"
>
  <div class="flex h-16 items-center gap-3 border-b border-white/[0.06] px-4">
    <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-brand to-purple-600 shadow-glow">
      <span class="material-icons text-lg text-white">auto_awesome</span>
    </div>
    @if (!collapsed) {
      <div class="min-w-0">
        <p class="truncate text-sm font-bold text-white">MarkAI</p>
        <p class="truncate text-[10px] text-slate-500">Autonomous Marketing</p>
      </div>
    }
  </div>

  <nav class="flex-1 space-y-1 p-3" aria-label="Main navigation">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="nav-active"
        class="nav-link group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-400 transition-all duration-200 hover:bg-white/[0.04] hover:text-slate-200"
        [attr.aria-label]="item.label"
        [title]="collapsed ? item.label : ''"
      >
        <span class="material-icons text-xl">{{ item.icon }}</span>
        @if (!collapsed) {
          <span class="truncate">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <div class="border-t border-white/[0.06] p-3">
    <button
      type="button"
      class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-slate-500 transition hover:bg-white/[0.04] hover:text-slate-300"
      (click)="toggleCollapse.emit()"
      [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <span class="material-icons text-xl">{{ collapsed ? 'chevron_right' : 'chevron_left' }}</span>
      @if (!collapsed) {
        <span>Collapse</span>
      }
    </button>
  </div>
</aside>
