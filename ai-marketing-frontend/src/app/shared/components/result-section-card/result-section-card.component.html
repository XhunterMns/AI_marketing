<div class="glass-card animate-slide-up overflow-hidden">
  <div class="flex items-center justify-between border-b border-white/[0.06] px-5 py-4">
    <div class="flex items-center gap-3">
      <span class="material-icons rounded-lg bg-brand/10 p-1.5 text-brand">{{ icon }}</span>
      <h3 class="font-semibold text-white">{{ title }}</h3>
    </div>
    <div class="flex items-center gap-1">
      <button type="button" class="icon-btn" (click)="copy.emit()" title="Copy" aria-label="Copy">
        <span class="material-icons text-lg">content_copy</span>
      </button>
      <button type="button" class="icon-btn" (click)="regenerate.emit()" title="Regenerate" aria-label="Regenerate">
        <span class="material-icons text-lg">refresh</span>
      </button>
      <button type="button" class="icon-btn" (click)="download.emit()" title="Download PDF" aria-label="Download PDF">
        <span class="material-icons text-lg">picture_as_pdf</span>
      </button>
      @if (showTelegram) {
        <button type="button" class="icon-btn" (click)="sendTelegram.emit()" title="Send to Telegram" aria-label="Send to Telegram">
          <span class="material-icons text-lg">send</span>
        </button>
      }
      <button type="button" class="icon-btn" (click)="toggleExpand()" [attr.aria-expanded]="expanded()" aria-label="Expand or collapse">
        <span class="material-icons text-lg">{{ expanded() ? 'expand_less' : 'expand_more' }}</span>
      </button>
    </div>
  </div>

  @if (expanded()) {
    <div class="px-5 py-4">
      @if (items.length) {
        <ul class="space-y-2">
          @for (item of items; track $index) {
            <li class="flex items-start gap-2 text-sm text-slate-300">
              <span class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-brand"></span>
              <span>{{ item }}</span>
            </li>
          }
        </ul>
      } @else {
        <p class="whitespace-pre-wrap text-sm leading-relaxed text-slate-300">{{ content }}</p>
      }
    </div>
  }
</div>
